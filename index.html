<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2219" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E2219'/%3E%3Cpath d='M9 22c0-7 5-12 14-12-1 8-6 13-14 12z' fill='%238FD3A8'/%3E%3C/svg%3E" />
    <title>AgroDataCore</title>
    <!--
      Pantalla de carga: va en el HTML (no en React) para que aparezca al instante,
      antes de que se descargue el JavaScript. src/lib/splash.ts la retira.
    -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background:
          radial-gradient(600px 380px at 50% 42%, rgba(143, 211, 168, 0.13), transparent 70%),
          radial-gradient(900px 600px at 85% -10%, var(--sp-cultivo, rgba(109, 58, 140, 0.35)), transparent 65%),
          #0e2219;
        color: #fff;
        font-family: 'Bricolage Grotesque Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity .5s ease, filter .5s ease;
      }
      #splash.splash-fuera { opacity: 0; filter: blur(6px); pointer-events: none; }
      #splash.splash-fuera .sp-centro { transform: scale(1.06); }
      .sp-centro { display: flex; flex-direction: column; align-items: center; transition: transform .5s ease; }

      /* Logo: el cuadro aparece, se dibuja el contorno de la hoja y luego se rellena */
      .sp-logo { position: relative; width: 88px; height: 88px; }
      .sp-logo svg { position: relative; width: 100%; height: 100%; animation: sp-entra .6s cubic-bezier(.2, .8, .2, 1) both; }
      .sp-hoja-linea { fill: none; stroke: #8fd3a8; stroke-width: 1.1; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-traza .7s .15s ease-out forwards; }
      .sp-hoja { fill: #8fd3a8; opacity: 0; animation: sp-aparece .45s .6s ease-out forwards; }
      .sp-vena { stroke: #17332a; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-traza .35s .85s ease-out forwards; }

      /* Ondas suaves detrás del logo */
      .sp-onda { position: absolute; inset: 0; border-radius: 24px; border: 1px solid rgba(143, 211, 168, .35); animation: sp-onda 2.2s .5s ease-out infinite; opacity: 0; }
      .sp-onda.b { animation-delay: 1.2s; }

      .sp-marca { margin-top: 22px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; animation: sp-sube .6s .35s cubic-bezier(.2, .8, .2, 1) both; }
      .sp-lema { margin-top: 4px; font-size: 13px; color: #8aa398; font-family: 'Hanken Grotesk Variable', ui-sans-serif, system-ui, sans-serif; animation: sp-sube .6s .5s cubic-bezier(.2, .8, .2, 1) both; }

      /* Barra de progreso indeterminada */
      .sp-barra { position: relative; margin-top: 26px; width: 148px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; animation: sp-aparece .4s .6s both; }
      .sp-barra::after { content: ''; position: absolute; inset: 0; width: 45%; border-radius: 3px; background: linear-gradient(90deg, transparent, #8fd3a8, transparent); animation: sp-recorre 1.1s .6s ease-in-out infinite; transform: translateX(-100%); }

      @keyframes sp-entra { from { opacity: 0; transform: scale(.82) rotate(-6deg); } to { opacity: 1; transform: none; } }
      @keyframes sp-traza { to { stroke-dashoffset: 0; } }
      @keyframes sp-aparece { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes sp-onda { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
      @keyframes sp-recorre { from { transform: translateX(-100%); } to { transform: translateX(230%); } }

      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
        .sp-hoja { opacity: 1; }
        .sp-hoja-linea, .sp-vena { stroke-dashoffset: 0; }
        .sp-onda { display: none; }
      }
    </style>
  </head>
  <body style="background:#0e2219">
    <div id="splash" role="status" aria-label="Cargando AgroDataCore">
      <script>
        // El brillo de fondo toma el color del último cultivo que usó la persona
        try {
          var c = (JSON.parse(localStorage.getItem('adc-filtros') || '{}').state || {}).crop;
          var col = { uva: '109,58,140', palta: '59,107,46', arandano: '52,73,156', mango: '181,96,10', limon: '108,138,14' }[c];
          if (col) document.getElementById('splash').style.setProperty('--sp-cultivo', 'rgba(' + col + ',0.38)');
        } catch (e) {}
      </script>
      <div class="sp-centro">
        <div class="sp-logo">
          <span class="sp-onda"></span>
          <span class="sp-onda b"></span>
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#17332a" />
            <path class="sp-hoja-linea" pathLength="1" d="M9 22c0-7 5-12 14-12-1 8-6 13-14 12z" />
            <path class="sp-hoja" d="M9 22c0-7 5-12 14-12-1 8-6 13-14 12z" />
            <path class="sp-vena" pathLength="1" d="M9 22l8-7" />
          </svg>
        </div>
        <div class="sp-marca">AgroDataCore</div>
        <div class="sp-lema">Inteligencia agroexportadora</div>
        <div class="sp-barra"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
